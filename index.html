<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nancy 2030 — Cité des Ducs</title>
    <link rel="icon" href="./favicon.png?v=20260914f" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=20260914f" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#2a2c30" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nancy 2030" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css?v=20260914e" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="loader">
      <div class="mark">N</div>
      <h1>Nancy 2030</h1>
      <p>Ouverture des archives OSM</p>
      <div id="bar"><i></i></div>
    </div>
    <div id="hud">
      <header class="topbar">
        <div class="brand">
          <div class="mark">N</div>
          <div>
            <p class="kicker"><a id="leska-link" href="#">Leska</a></p>
            <h1>Nancy <em>2030</em></h1>
          </div>
        </div>
        <p class="coords">48°41′N&ensp;6°11′E<span>Grand Est</span></p>
      </header>

      <aside class="explorer" id="explorer">
        <button type="button" class="explorer-head" id="explorer-toggle" aria-expanded="true">
          <span>À explorer</span>
          <span id="place-count">00</span>
        </button>
        <div class="places" id="places"></div>
        <p class="credit">
          Produit par <a href="https://atelieriter.com" target="_blank" rel="noopener">atelieriter</a><br />
          sur la base d’un prompt de Maxime
          <a href="https://www.linkedin.com/feed/update/urn:li:activity:7503830548750942209/" target="_blank" rel="noopener">Piquette</a>
        </p>
      </aside>

      <footer class="dock" id="dock">
        <button type="button" class="clock-block" id="dock-toggle" aria-expanded="true">
          <p class="kicker">Nancy</p>
          <div id="clock">14:30</div>
          <p id="period">L’après-midi</p>
        </button>
        <div class="slider-wrap">
          <input id="hour" type="range" min="0" max="23.99" step="0.05" value="14.5" />
          <div class="ticks">
            <span>06h Aube</span>
            <span>12h Midi</span>
            <span>18h Soir</span>
            <span>00h Nuit</span>
          </div>
        </div>
        <div class="weather" role="group" aria-label="Météo">
          <button type="button" id="wx-sun" class="wx on" title="Soleil" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4.2" />
              <path
                d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.1 5.1l1.6 1.6M17.3 17.3l1.6 1.6M5.1 18.9l1.6-1.6M17.3 6.7l1.6-1.6"
              />
            </svg>
            <span>Éclaircie</span>
          </button>
          <button type="button" id="wx-snow" class="wx" title="Neige" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 3.2v17.6M5.4 7.1l13.2 9.8M5.4 16.9l13.2-9.8M12 3.2l2.2 2.2M12 3.2l-2.2 2.2M12 20.8l2.2-2.2M12 20.8l-2.2-2.2M5.4 7.1l.4 3M5.4 7.1l2.8-.2M18.6 16.9l-.4-3M18.6 16.9l-2.8.2"
              />
            </svg>
            <span>Neige</span>
          </button>
        </div>
      </footer>

    </div>
    <script>
      setTimeout(() => {
        const loader = document.getElementById("loader");
        const p = loader?.querySelector("p");
        if (loader && !loader.classList.contains("hidden") && p && /Ouverture/.test(p.textContent)) {
          p.textContent = "Le moteur 3D démarre… si ça reste bloqué : ⇧⌘R";
        }
      }, 8000);
    </script>
    <script type="module" src="./js/main.js?v=20260914l"></script>
  </body>
</html>
